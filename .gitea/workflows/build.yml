# Autarkia's CI: unit-test and build every Minecraft node against the library as a stranger would
# resolve it, boot the pair from the jars that ship, and release when a tag says to.
#
# This runs with no Anima checkout anywhere. The workspace's local-Maven directory
# (`../anima/build/local-maven`) simply is not there, Gradle falls through to the Gitea registry,
# and that is the point — the path a third party takes is the path CI takes, so it is broken here
# first rather than in somebody's clone. The smoke then boots what that resolved, so the library
# under test is the one this was compiled against by construction.
#
# Nothing in this file reaches a private repository. See 2026-08-18-per-repo-ci-smoke-design.md.
name: CI

on:
  push:
    branches: [main]
    # A bare `v0.1.5` is unambiguous here: one repo, one mod, one version. The `autarkia-v`
    # prefix this used to require was a leftover from the combined tree (dropped 2026-08-18).
    tags: ['v*']
  pull_request:
  # The STRICT run — non-primary nodes are allowed to lag on an ordinary push (see
  # continue-on-error), which without this would let a broken node report green until a release
  # tag found it. Staggered from Anima's: one runner serves both.
  schedule:
    - cron: '27 4 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Minecraft version for the snapshot job; empty is what snapshot.version names'
        required: false
        default: ''

# Step names carry no `${{ matrix.version }}`: Gitea's runner does not evaluate expressions in a
# step's `name:` (GitHub does), so it renders the template at the reader. The matrix job header
# already says `build (26.1.x)`. Artifact names under `with:` ARE expanded — leave those alone.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 1.20.1 and 1.21.1 are temporarily dropped: Person is built on the 1.21.9+ Avatar and
        # retained-mode render pipeline. This list must match Anima's, and the smoke below is what
        # notices when it stops: a node Anima never published has no `anima-<mc>` to resolve, and a
        # fabric_api pin that has drifted is EXERCISED rather than compared, because one API jar is
        # installed and both mods run against it.
        version: ['1.21.11', '26.1.x', '26.2.x', '26.3.x']
    continue-on-error: >-
      ${{ matrix.version != '26.1.x'
          && github.event_name != 'schedule'
          && !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `git describe --tags --exact-match` decides release vs snapshot, and a shallow
          # checkout fetches no tags — which would stamp a release with a snapshot version.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Per-node toolchains: 26.x compiles on 25, 1.21.11 on 21. JAVA_HOME follows the last
          # entry, so Gradle itself runs on 25.
          java-version: |
            21
            25

      - name: Point Gradle at the installed JDKs
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64' > ~/.gradle/gradle.properties

      # v3, not v4: the newer cache protocol assumes github.com. Never fatal — an unreachable
      # cache is a slow build, not a broken one.
      - name: Cache the Gradle and Loom caches
        uses: actions/cache@v3
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/fabric-loom
            ~/.gradle/wrapper
            ~/.gradle/jdks
          key: gradle-${{ matrix.version }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'stonecutter.properties.toml') }}
          restore-keys: gradle-${{ matrix.version }}-

      # THE CACHE WOULD OTHERWISE HIDE THE LIBRARY MOVING. `0.1.0-SNAPSHOT` is a changing module,
      # and Gradle holds a changing module for 24 hours before it asks again — so a restored cache
      # builds this mod against yesterday's Anima and reports green on a pair that was never
      # tried. Only our own group is dropped, so every other dependency stays cached.
      - name: Forget any cached Anima
        run: |
          rm -rf ~/.gradle/caches/modules-2/files-2.1/dev.luizloyola \
                 ~/.gradle/caches/modules-2/metadata-*/descriptors/dev.luizloyola

      - name: Compute the build label
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "label=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "label=build.$(git log -1 --format=%cd --date=format:%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      # A change spanning both mods is two pushes seconds apart, so this can reach dependency
      # resolution while Anima is still building and resolve the PREVIOUS library; the script
      # says why at length. Last of the setup steps on purpose: checkout, the JDKs and the cache
      # restore all run while Anima builds, so only the part that cannot overlap is waited for.
      - name: Wait out a running Anima build
        run: scripts/wait-for-anima.sh "build (${{ matrix.version }})"
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          GITEA_SERVER: ${{ github.server_url }}
          GITEA_OWNER: ${{ github.repository_owner }}

      # `build` depends on `check`, so these already run — but Gradle does not ORDER test before
      # assemble, so a unit-test failure can arrive after remapJar has run. Asking for it first
      # costs nothing, fails sooner, and names itself in the step list.
      #
      # The credentials are for RESOLVING: the tests read Anima's test fixtures from the registry,
      # and the instance serves nothing anonymously.
      - name: Unit-test
        run: ./gradlew ":${{ matrix.version }}:test" --no-daemon
        env:
          GITEA_USER: ${{ github.repository_owner }}
          GITEA_TOKEN: ${{ secrets.CI_TOKEN }}

      # One segment: a ROOT branch, so `:26.1.x`, never `:autarkia:26.1.x`.
      #
      # The credentials are for RESOLVING, not publishing: the instance serves nothing
      # anonymously, and Anima lives on it. Without them the build fails at dependency
      # resolution with a 401, which is the honest failure — there is no other copy to fall back
      # to on a runner.
      - name: Build
        run: ./gradlew ":${{ matrix.version }}:build" --no-daemon
        env:
          GITEA_USER: ${{ github.repository_owner }}
          # Not named GITEA_* — Gitea reserves that prefix for the token it injects itself.
          GITEA_TOKEN: ${{ secrets.CI_TOKEN }}

      - name: Upload jars
        # v4 hard-fails on non-github.com hosts (its GHES check); v3 is the Gitea-supported path.
        uses: actions/upload-artifact@v3
        with:
          name: autarkia-${{ steps.ver.outputs.label }}-mc${{ matrix.version }}
          path: versions/${{ matrix.version }}/build/libs/*.jar
          retention-days: 14

      # "Download the equivalent Anima" — and equivalent is decided by the RESOLVER, not by a rule.
      # Same coordinate, same repositories, same Gradle run as the build above, so the snapshot
      # timestamp is the one the compile picked. A plain configuration rather than
      # `modImplementation`, because Loom would hand back its dev-remapped copy and a real server
      # needs the published artifact.
      - name: Stage this mod and the Anima it was built against
        run: ./gradlew ":${{ matrix.version }}:smokeMods" --no-daemon
        env:
          GITEA_USER: ${{ github.repository_owner }}
          GITEA_TOKEN: ${{ secrets.CI_TOKEN }}

      # A build proves this mod agrees with Anima's API. It cannot see a mixin that fails to apply,
      # a client-only class touched from common code, or a Person that never ticks — and only a
      # REAL server booted from the jars that ship can see the pair load each other at all.
      #
      # No artifact upload for the log. Artifacts are write-only on this Gitea: upload-artifact@v3
      # finalises successfully and neither the API nor the web route can read the result back
      # (measured 2026-08-18). smoke.sh tails the last 60 lines into THIS log on failure instead,
      # which is readable.
      #
      # The EULA is the operator's legal choice and the script refuses to make it. This line is the
      # repository owner recording that choice, which is the only place it belongs.
      - name: Boot the pair, spawn a Person, read it back
        run: scripts/smoke.sh "${{ matrix.version }}"
        env:
          SMOKE_EULA: 'true'
          # A cold runner downloads Minecraft and its libraries before it can log "Done".
          READY_TIMEOUT: '900'

      # Only on red, and only then: on green nobody reads them and they are pure storage.
      # Below the smoke deliberately: `failure()` only sees the steps BEFORE it, so sitting up by
      # the build it was skipped on exactly the runs that boot-fail with tests worth reading.
      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: autarkia-test-reports-mc${{ matrix.version }}
          path: versions/${{ matrix.version }}/build/reports/tests/
          retention-days: 14

      # No maven publish: nothing compiles against this mod. Modrinth is where its players get it,
      # and only a tag puts it there. Anima is released first and its `deps.anima` pin bumped
      # here — that ordering is manual on purpose, because it is where somebody decides the pair
      # is good.
      - name: Release to Modrinth
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew ":${{ matrix.version }}:publishMods" --no-daemon
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GITEA_USER: ${{ github.repository_owner }}
          GITEA_TOKEN: ${{ secrets.CI_TOKEN }}

  # The snapshot node: this mod, beside the Anima built for the same Minecraft version, against a
  # version that is not a target yet. It runs when this commit carries `snapshot.version`, which
  # the workspace's hourly watch commits to main once Anima's snapshot job has published
  # `anima-<mc>`, and removes once that line is a target; without the file it does nothing.
  #
  # Lagging is allowed as for any non-primary node, strict on the nightly. Never on a tag: nothing
  # here reaches Modrinth, and a release must not wait on Mojang's week.
  snapshot:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 25 alone: every 26.x runs on it, and scripts/snapshot.sh refuses a build that does not,
      # naming the places to teach when Mojang moves.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Point Gradle at the installed JDK
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.java.installations.fromEnv=JAVA_HOME_25_X64' > ~/.gradle/gradle.properties

      # A dispatch's `version` wins over the file, which is how a version is tried by hand. The
      # verdict is snapshot.sh's exit code: 0 a node to try, 3 nothing newer than the targets, 4 a
      # build the ecosystem has not caught up with. Only another code is this step failing.
      - name: Resolve the build to try
        id: pick
        run: |
          want="${{ github.event.inputs.version }}"
          if [[ -z "$want" && -f snapshot.version ]]; then want=$(tr -d '[:space:]' < snapshot.version); fi
          if [[ -z "$want" ]]; then
            echo "no snapshot.version on this commit: nothing to try"
            echo "state=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          scripts/snapshot.sh "$want"
          rc=$?
          set -e
          case $rc in
            0) echo "state=ready" >> "$GITHUB_OUTPUT" ;;
            3) echo "state=nothing" >> "$GITHUB_OUTPUT" ;;
            4) echo "state=waiting" >> "$GITHUB_OUTPUT" ;;
            *) exit $rc ;;
          esac

      - name: Cache the Gradle and Loom caches
        if: steps.pick.outputs.state == 'ready'
        uses: actions/cache@v3
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/fabric-loom
            ~/.gradle/wrapper
            ~/.gradle/jdks
          key: gradle-snapshot-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'versions/snapshot/stonecutter.properties.toml') }}
          restore-keys: gradle-snapshot-

      # As in the build job: a changing module is held for 24 hours, and a restored cache would
      # build against an older Anima and call the pair tried.
      - name: Forget any cached Anima
        if: steps.pick.outputs.state == 'ready'
        run: |
          rm -rf ~/.gradle/caches/modules-2/files-2.1/dev.luizloyola \
                 ~/.gradle/caches/modules-2/metadata-*/descriptors/dev.luizloyola

      - name: Wait out a running Anima build
        if: steps.pick.outputs.state == 'ready'
        run: scripts/wait-for-anima.sh snapshot
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          GITEA_SERVER: ${{ github.server_url }}
          GITEA_OWNER: ${{ github.repository_owner }}

      # The watch commits the file here only after Anima has published `anima-<mc>`, so a miss is
      # Anima's snapshot job red since, or a hand dispatch that came too early.
      - name: Is Anima published for it?
        if: steps.pick.outputs.state == 'ready'
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          pin=$(awk '/^\[/{exit} /^deps\.anima/{sub(/.*= *"/,"");sub(/".*/,"");print;exit}' stonecutter.properties.toml)
          url="${{ github.server_url }}/api/packages/${{ github.repository_owner }}/maven/dev/luizloyola/anima-${{ steps.pick.outputs.minecraft }}/$pin/maven-metadata.xml"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: token $CI_TOKEN" "$url")
          if [[ "$code" != 200 ]]; then
            echo "::error::Anima has not published anima-${{ steps.pick.outputs.minecraft }} $pin (http $code) — Anima's snapshot job has to go green for it first"
            exit 1
          fi

      - name: Unit-test
        if: steps.pick.outputs.state == 'ready'
        run: ./gradlew :snapshot:test --no-daemon
        env:
          GITEA_USER: ${{ github.repository_owner }}
          GITEA_TOKEN: ${{ secrets.CI_TOKEN }}

      - name: Build
        if: steps.pick.outputs.state == 'ready'
        run: ./gradlew :snapshot:build --no-daemon
        env:
          GITEA_USER: ${{ github.repository_owner }}
          GITEA_TOKEN: ${{ secrets.CI_TOKEN }}

      - name: Stage this mod and the Anima it was built against
        if: steps.pick.outputs.state == 'ready'
        run: ./gradlew :snapshot:smokeMods --no-daemon
        env:
          GITEA_USER: ${{ github.repository_owner }}
          GITEA_TOKEN: ${{ secrets.CI_TOKEN }}

      - name: Boot the pair, spawn a Person, read it back
        if: steps.pick.outputs.state == 'ready'
        run: scripts/smoke.sh snapshot
        env:
          SMOKE_EULA: 'true'
          READY_TIMEOUT: '900'

      - name: Upload the test reports
        if: failure() && steps.pick.outputs.state == 'ready'
        uses: actions/upload-artifact@v3
        with:
          name: autarkia-test-reports-snapshot-${{ steps.pick.outputs.minecraft }}
          path: versions/snapshot/build/reports/tests/
          retention-days: 14
