# This file is used for Gradle options, for the rest use stonecutter.properties.toml
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true
# Only configure the version nodes a task actually needs - keeps single-node builds
# (and each CI matrix job) from resolving Minecraft for all five versions
org.gradle.configureondemand=true
